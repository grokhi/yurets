name: Check production TLS
on:
  push:
    branches: [maintenance/tls]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.ssh/known_hosts
          key: timeweb-6355545-known-hosts-v1
      - name: Public TLS chain and DNS
        run: python3 scripts/check-tls.py
      - name: Inspect server certificate configuration
        env:
          SSHPASS: ${{ secrets.YURETS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y sshpass
          fi
          sshpass -e ssh -F /dev/null -T -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 root@147.45.100.176 'bash -s' <<'REMOTE' > server-report.txt
          date -u
          nginx -t
          nginx -T 2>/dev/null | awk '$1=="ssl_certificate" {gsub(/;/,"",$2); print $2}' | sort -u | while read -r cert; do
            echo "Certificate file: $cert"
            grep -c 'BEGIN CERTIFICATE' "$cert"
            openssl x509 -in "$cert" -noout -subject -issuer -dates -ext subjectAltName
          done
          systemctl is-active certbot.timer || true
          certbot certificates 2>/dev/null
          REMOTE
          python3 - <<'PY'
          from pathlib import Path
          text=Path('server-report.txt').read_text()
          print('::notice title=Server certificate::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY

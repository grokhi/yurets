name: Inspect radio availability
on:
  push:
    branches: [maintenance/radio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.ssh/known_hosts
          key: timeweb-6355545-known-hosts-v1
      - name: Inspect storage and Plex connectivity
        env:
          SSHPASS: ${{ secrets.YURETS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y sshpass
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          sshpass -e ssh -F /dev/null -T -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 root@147.45.100.176 'docker exec -i yurets-backend-1 python -' < scripts/inspect-radio.py > radio-report.txt
          python3 - <<'PY'
          from pathlib import Path
          report=Path('radio-report.txt').read_text()
          print('::notice title=Radio diagnostics::'+report.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Юрец ФМ</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/radio.css">
  <script src="/static/radio.js" defer></script>
</head>
<body>
  <main>
    <h1>Юрец ФМ</h1>
    <div class="row"><b>Текущий трек:</b> <span id="now-playing" aria-live="polite">Загрузка…</span></div>
    <div class="row"><b>Альбом:</b> <span id="album">—</span></div>
    <div class="row"><b>Источник:</b> Plex</div>
    <div class="row">
      <button id="listen" type="button">Слушать эфир</button>
      <audio id="player" controls preload="none" aria-label="Радио Юрец ФМ"></audio>
      <p id="playback-status" role="status"></p>
    </div>
    <section class="row" aria-labelledby="queue-label">
      <h2 id="queue-label">Далее в эфире</h2>
      <ol id="queue"><li>Загрузка…</li></ol>
    </section>
    <section class="row" aria-labelledby="schedule-label">
      <h2 id="schedule-label">Альбомы на сегодня</h2>
      <p id="schedule-date"></p>
      <div id="schedule">Загрузка…</div>
    </section>
    <p class="note">Для статистики посещений и прослушиваний сохраняются IP, страна и идентификатор этого браузера.</p>
    <p><a href="/stats">Статистика</a></p>
  </main>
  <footer>Powered by sovbak yebak experience.</footer>
</body>
</html>

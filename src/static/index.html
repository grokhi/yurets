<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Юрец</title>
  <link rel="icon" href="/static/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/static/radio.css?v=4">
  <script src="/static/radio.js?v=5" defer></script>
</head>
<body>
  <main>
    <h1>Радио Юрец</h1>
    <p><a href="/stats">Статистика</a> · <a href="#schedule-label">Расписание</a></p>
    <audio id="player" src="/stream" controls preload="none" aria-label="Радио Юрец"></audio>
    <p id="playback-status" role="status"></p>
    <p class="now-playing" aria-live="polite"><span id="now-playing">Загрузка…</span> · <span id="album">—</span></p>
    <section aria-labelledby="queue-label">
      <h2 id="queue-label">Далее в эфире</h2>
      <div class="table-wrap" role="region" aria-labelledby="queue-label" tabindex="0">
        <table>
          <thead><tr><th scope="col">Исполнитель</th><th scope="col">Трек</th><th scope="col">Альбом</th></tr></thead>
          <tbody id="queue"><tr><td colspan="3">Загрузка…</td></tr></tbody>
        </table>
      </div>
    </section>
    <section aria-labelledby="schedule-label">
      <h2 id="schedule-label">Альбомы на сегодня</h2>
      <p id="schedule-date"></p>
      <div class="table-wrap" role="region" aria-labelledby="schedule-label" tabindex="0">
        <table>
          <thead><tr><th scope="col">Время</th><th scope="col">Исполнитель</th><th scope="col">Альбом</th><th scope="col">Треков</th></tr></thead>
          <tbody id="schedule"><tr><td colspan="4">Загрузка…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer>Powered by sovbak yebak experience.</footer>
</body>
</html>
